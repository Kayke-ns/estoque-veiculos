spring.application.name=estoque-veiculos
server.port=8080

# ---------- MySQL (perfil padrao) ----------
# Ajuste usuario/senha ou use as variaveis de ambiente DB_URL, DB_USER, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/estoque_veiculos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# "update" cria/ajusta as tabelas a partir das entidades.
# O modelo fisico equivalente esta em database/schema.sql.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.serialization.write-dates-as-timestamps=false

# Popula dados de exemplo se o banco estiver vazio
app.carga-inicial=true
