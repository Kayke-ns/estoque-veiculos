<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estoque de Veículos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topo">
  <div>
    <h1>Estoque de Veículos</h1>
    <p>Sistema Automotivo · Java + Spring Boot + MySQL</p>
  </div>
  <nav>
    <button class="aba ativa" data-aba="veiculos">Veículos</button>
    <button class="aba" data-aba="catalogo">Marcas e Modelos</button>
  </nav>
</header>

<main>
  <section id="aba-veiculos">
    <div class="cards" id="resumo"></div>

    <form id="filtros" class="painel filtros">
      <label>Busca<input name="busca" placeholder="modelo, marca ou placa"></label>
      <label>Marca<select name="marcaId"></select></label>
      <label>Modelo<select name="modeloId"></select></label>
      <label>Tipo<select name="tipo">
        <option value="">Todos</option><option>HATCH</option><option>SEDAN</option><option>SUV</option>
        <option>PICAPE</option><option>MOTO</option><option>UTILITARIO</option></select></label>
      <label>Status<select name="status">
        <option value="">Todos</option><option>DISPONIVEL</option><option>RESERVADO</option>
        <option>VENDIDO</option><option>DESCONTINUADO</option></select></label>
      <label>Preço mín.<input name="precoMin" type="number" min="0" step="1000"></label>
      <label>Preço máx.<input name="precoMax" type="number" min="0" step="1000"></label>
      <label>Ano mín.<input name="anoMin" type="number" min="1950"></label>
      <label>Ano máx.<input name="anoMax" type="number" min="1950"></label>
      <label>Ordenar<select name="ordenarPor">
        <option value="atualizadoEm">Mais recentes</option><option value="preco">Preço</option>
        <option value="anoFabricacao">Ano</option><option value="quilometragem">Quilometragem</option></select></label>
      <label>Direção<select name="direcao"><option value="desc">Decrescente</option><option value="asc">Crescente</option></select></label>
      <div class="acoes-filtro">
        <button type="submit" class="primario">Filtrar</button>
        <button type="reset">Limpar</button>
      </div>
    </form>

    <div class="barra">
      <span id="contador"></span>
      <button class="primario" id="btn-novo">+ Novo veículo</button>
    </div>

    <div class="painel tabela-wrap">
      <table>
        <thead><tr>
          <th>#</th><th>Marca / Modelo</th><th>Tipo</th><th>Ano</th><th>Cor</th>
          <th class="num">Preço</th><th class="num">Km</th><th>Placa</th><th>Status</th><th></th>
        </tr></thead>
        <tbody id="lista"></tbody>
      </table>
    </div>
  </section>

  <section id="aba-catalogo" hidden>
    <div class="duas-colunas">
      <div class="painel">
        <h2>Marcas</h2>
        <form id="form-marca" class="inline">
          <input name="nome" placeholder="Nome da marca" required>
          <input name="paisOrigem" placeholder="País de origem">
          <button class="primario">Adicionar</button>
        </form>
        <ul id="lista-marcas" class="lista"></ul>
      </div>
      <div class="painel">
        <h2>Modelos</h2>
        <form id="form-modelo" class="inline">
          <input name="nome" placeholder="Nome do modelo" required>
          <select name="tipo" required>
            <option>HATCH</option><option>SEDAN</option><option>SUV</option>
            <option>PICAPE</option><option>MOTO</option><option>UTILITARIO</option></select>
          <select name="marcaId" required></select>
          <button class="primario">Adicionar</button>
        </form>
        <ul id="lista-modelos" class="lista"></ul>
      </div>
    </div>
  </section>
</main>

<dialog id="modal">
  <form id="form-veiculo" method="dialog">
    <h2 id="modal-titulo">Novo veículo</h2>
    <input type="hidden" name="id">
    <div class="grade">
      <label>Modelo<select name="modeloId" required></select></label>
      <label>Ano<input name="anoFabricacao" type="number" min="1950" required></label>
      <label>Cor<input name="cor" required></label>
      <label>Preço (R$)<input name="preco" type="number" min="1" step="0.01" required></label>
      <label>Quilometragem<input name="quilometragem" type="number" min="0" required></label>
      <label>Placa<input name="placa" placeholder="ABC1D23"></label>
      <label>Status<select name="status">
        <option>DISPONIVEL</option><option>RESERVADO</option><option>VENDIDO</option><option>DESCONTINUADO</option></select></label>
    </div>
    <p class="erro" id="erro-form"></p>
    <div class="rodape-modal">
      <button type="button" id="btn-cancelar">Cancelar</button>
      <button type="submit" class="primario">Salvar</button>
    </div>
  </form>
</dialog>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
